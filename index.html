<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <form class="inventory_form">
      <label>Name:</label><input class="name_input">
      <label>Price:</label><input class="price_input">
      <label>Stock:</label><input class="stock_input">
      <div>
        <button type="button" class="create btn">create</button>
        <button type="button" class="clear btn">clear</button>
      </div>
    </form>
    <br>
    <table class="inventory_table">
      <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Action</th>
      </tr>
      <tr>
        <td>lamp</td>
        <td>$22.09</td>
        <td>5</td>
        <td>
          <div class="action_buttons">
            <button class="read btn">read</button>
            <button class="update btn">update</button>
            <button class="delete btn">delete</button>
          </div>
        </td>
      </tr>
      <tr>
        <td>mug</td>
        <td>$4.97</td>
        <td>10</td>
        <td>
          <div class="action_buttons">
            <button class="read btn">read</button>
            <button class="update btn">update</button>
            <button class="delete btn">delete</button>
          </div>
        </td>
      </tr>
      <tr>
        <td>earphones</td>
        <td>$16.50</td>
        <td>25</td>
        <td>
          <div class="action_buttons">
            <button class="read btn">read</button>
            <button class="update btn">update</button>
            <button class="delete btn">delete</button>
          </div>
        </td>
      </tr>
    </table>
    <br>
    <div class="item_display">
      <span>name:</span><span class="name_span"></span>
      <span>price:</span><span class="price_span"></span>
      <span>stock:</span><span class="stock_span"></span>
    </div>
    <script src="app.js"></script>
  </body>
</html>
